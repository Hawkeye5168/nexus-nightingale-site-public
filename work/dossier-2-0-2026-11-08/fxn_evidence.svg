<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><rect width="1200" height="420" fill="#FFFFFF"/>
<text x="30" y="38" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="#173F5F">Evidence base and registry landscape</text>
<text x="30" y="62" font-family="Segoe UI,Arial" font-size="13" fill="#41789B">Source tiers from the FXN evidence map; trial total from ClinicalTrials.gov on 2026-11-07.</text><text x="30" y="130" font-family="Segoe UI,Arial" font-size="14" font-weight="700" fill="#173F5F">T1</text><rect x="220" y="110.0" width="780.0" height="26" rx="4" fill="#41789B"/><text x="1010.0" y="130" font-family="Segoe UI,Arial" font-size="13" fill="#173F5F">7 sources</text><text x="30" y="178" font-family="Segoe UI,Arial" font-size="14" font-weight="700" fill="#173F5F">T2</text><rect x="220" y="158.0" width="334.3" height="26" rx="4" fill="#41789B"/><text x="564.3" y="178" font-family="Segoe UI,Arial" font-size="13" fill="#173F5F">3 sources</text><text x="30" y="226" font-family="Segoe UI,Arial" font-size="14" font-weight="700" fill="#173F5F">T3</text><rect x="220" y="206.0" width="111.4" height="26" rx="4" fill="#41789B"/><text x="341.4" y="226" font-family="Segoe UI,Arial" font-size="13" fill="#173F5F">1 sources</text><text x="30" y="315" font-family="Segoe UI,Arial" font-size="14" font-weight="700" fill="#173F5F">Trials</text><rect x="220" y="295" width="780" height="26" rx="4" fill="#D1D9E0"/><rect x="220" y="295" width="780" height="26" rx="4" fill="#C7562F" opacity="0.18"/><text x="230.0" y="315" font-family="Segoe UI,Arial" font-size="13" fill="#173F5F">115 studies listed</text><text x="30" y="375" font-family="Segoe UI,Arial" font-size="11" fill="#41789B">A registry listing is not evidence of efficacy. T1 = primary/experimental source; T2 = curated registry/reference; T3 = registry index.</text></svg>